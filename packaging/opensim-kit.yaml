# OpenSim Kit, built by apt-package: metapackage installing the command line, the website of a grid and the
# latest OpenSimulator release. ${VERSION} comes from the git tag.
name: opensim-kit
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  OpenSimulator with its command line and its website
  Installs the opensim command (w4os-cli), the website of a grid
  (w4os-site) and its helpers (w4os-helpers, recommended), the latest
  OpenSimulator release, its essential modules and a database server, ready
  to create and run grids and regions.
homepage: https://github.com/way4os/opensim-kit
license: AGPL-3.0-or-later

depends:
  - opensim
  # The handful of essential modules, for the latest release; the others are
  # in the repository, not installed automatically
  - opensim-${OPENSIM_VERSION}-opensimsearch
  - opensim-${OPENSIM_VERSION}-gloebit
  # The command line; it removes opensim-tools, the approach before it
  - w4os-cli
  # The postinst enables the essential modules through it
  - w4os-engine
  # The website of a grid
  - w4os-site
  # OpenSim cannot run without a database: everything on this machine
  - default-mysql-server | virtual-mysql-server

# The helpers of a grid (its economy, its search, its offline messages V1): optional, a full install brings them
recommends:
  - w4os-helpers

scripts:
  postinstall: packaging/opensim-kit.postinst
